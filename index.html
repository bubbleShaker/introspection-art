<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mona Wonderlick「Introspection」に反応して揺れる、水面と反射のジェネラティブアート。"
    />
    <meta name="theme-color" content="#04060f" />
    <title>Introspection — 水面と反射</title>
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="音に反応して揺れる水面と、その反射"></canvas>

    <div id="overlay">
      <h1>Introspection</h1>
      <p id="overlay-note">読み込んでいます…</p>
      <button id="enter" type="button" disabled>準備中</button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <footer id="chrome">
      <button id="toggle" type="button" hidden aria-pressed="false">再生</button>
      <p class="credit">
        Music: <strong>Introspection</strong> — Mona Wonderlick
        <a href="https://youtu.be/UZzuVt7nKOA" target="_blank" rel="noopener noreferrer">YouTube</a>
      </p>
      <p class="hint">音源をドロップすると、その曲で水面が揺れます</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
