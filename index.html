<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mona Wonderlick「Introspection」に反応して揺れる、水面と反射のジェネラティブアート。"
    />
    <meta name="theme-color" content="#04060f" />
    <title>Introspection — 水面と反射</title>
  </head>
  <body>
    <!--
      絵は p5 が作る canvas に描く。ここは置き場所だけを用意する。
      role と aria-label は、生成された canvas 側に付ける（glScene.ts）。
    -->
    <div id="stage"></div>

    <div id="overlay">
      <h1>Introspection</h1>
      <p id="overlay-note">読み込んでいます…</p>
      <button id="enter" type="button" disabled>準備中</button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <footer id="chrome">
      <button id="toggle" type="button" hidden aria-pressed="false">再生</button>
      <p class="credit">
        Music: <strong>Introspection</strong> — Mona Wonderlick
        <a href="https://youtu.be/UZzuVt7nKOA" target="_blank" rel="noopener noreferrer">YouTube</a>
      </p>
      <p class="hint">ドロップでも渡せます</p>
      <!--
        スマホにはドラッグ&ドロップが無いので、ファイル選択の口を用意する。
        入力そのものは見せず、隣のボタンから開く（見た目を他のボタンと揃えるため）。

        hidden ではなく visually-hidden なのは、display: none の input への
        click() を無視する実装があるため。レイアウト上は在るまま、目にだけ入らない。
        操作の窓口はボタン一つに絞るので、input は支援技術とタブ順から外す。

        accept は付けない。ダイアログは accept を OS の拡張子→MIME 対応表から
        展開するので、関連付け次第で正当な mp3 まで選べなくなる。そもそも型では
        弾かない方針（鳴らせるかは再生してみて決める）なので、絞る利より
        選べなくなる害の方が大きい。
      -->
      <input id="file" class="visually-hidden" type="file" tabindex="-1" aria-hidden="true" />
      <button id="pick" type="button">音源を選ぶ</button>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
